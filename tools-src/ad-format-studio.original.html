<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Ad Format Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: Figma-style editor. Top bar, sub-heading menu bar with dropdowns, canvas or site preview, properties panel right (below on narrow). */
:root{
  --ui:#ffffff; --ui2:#f5f6f8; --canvas:#e3e5e9; --dot:rgba(30,40,60,.13);
  --section:#eef0f3; --section-line:#d5d9df; --line:#e1e4e8;
  --fg:#15181d; --muted:#5f6671; --faint:#959ba5;
  --accent:#0b85e6; --accent-soft:#e2f0fc; --accent-fg:#ffffff;
  --s5:#11994f; --s4:#5e9d1d; --s3:#c98700; --s2:#de5a0d; --s1:#d22e2e;
  --pass:#11994f; --warn:#b67a00; --fail:#d22e2e; --info:#7b818b;
  --shadow:0 8px 28px rgba(16,24,40,.16);
  --f-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ui:#1d1f23; --ui2:#24272c; --canvas:#131417; --dot:rgba(255,255,255,.07);
  --section:#1a1c20; --section-line:#2b2e34; --line:#2c2f35;
  --fg:#e8eaee; --muted:#a3a9b3; --faint:#6f7680;
  --accent:#3a9ef5; --accent-soft:#17324c; --accent-fg:#ffffff;
  --warn:#e2a41c; --info:#8d939d; --shadow:0 8px 28px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ui:#1d1f23; --ui2:#24272c; --canvas:#131417; --dot:rgba(255,255,255,.07);
  --section:#1a1c20; --section-line:#2b2e34; --line:#2c2f35;
  --fg:#e8eaee; --muted:#a3a9b3; --faint:#6f7680;
  --accent:#3a9ef5; --accent-soft:#17324c; --accent-fg:#ffffff;
  --warn:#e2a41c; --info:#8d939d; --shadow:0 8px 28px rgba(0,0,0,.5);
  color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--canvas);color:var(--fg);font:13px/1.45 var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;display:flex;flex-direction:column}
.gut{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

/* top bar */
.top{height:48px;flex:none;display:flex;align-items:center;gap:8px;background:var(--ui);border-bottom:1px solid var(--line);padding-block:0;position:relative;z-index:30}
.mark{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;min-width:0}
.mark svg{flex:none}
.mark small{font:500 11px var(--f-mono);color:var(--faint);letter-spacing:0}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--ui);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--ui2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.block{width:100%;justify-content:center}
.ibtn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:6px;border:0;background:transparent;flex:none}
.ibtn:hover{background:var(--ui2)}
.ibtn[disabled]{opacity:.35;cursor:not-allowed}
.zoom{display:flex;align-items:center;gap:2px;font:500 12px var(--f-mono);color:var(--muted)}
.zoom output{min-width:44px;text-align:center}

/* sub-heading menu bar */
.sub{height:40px;flex:none;display:flex;align-items:center;gap:2px;background:var(--ui);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding-block:0;position:relative;z-index:29}
.sub::-webkit-scrollbar{display:none}
.mb{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:0;border-radius:6px;background:transparent;font-weight:500;white-space:nowrap;color:var(--fg)}
.mb:hover{background:var(--ui2)}
.mb[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
.mb .n{font:500 11px var(--f-mono);color:var(--faint)}
.mb svg{opacity:.6}
.modeseg{flex:none;margin-left:8px}
.pop{position:fixed;z-index:50;background:var(--ui);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:min(390px,calc(100vw - 16px));overflow:auto;overscroll-behavior:contain}

/* main */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}
.stage{position:relative;min-width:0;min-height:0;display:grid}
.stage>*{grid-area:1/1;min-width:0;min-height:0}
.panel{background:var(--ui);overflow:auto;min-width:0;min-height:0;overscroll-behavior:contain}
#right{border-left:1px solid var(--line)}
.psec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.psec:last-child{border-bottom:0}
.psec h3{margin:0;font:600 11px/1 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.psec h3 .aside{font:500 11px var(--f-mono);letter-spacing:0;text-transform:none;color:var(--faint)}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* asset */
.asset{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center}
.thumb{width:72px;height:72px;border-radius:6px;background:var(--ui2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.asset .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asset .meta{font:12px/1.5 var(--f-mono);color:var(--muted)}
.tag{display:inline-block;font:600 10px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border-radius:3px;background:var(--accent-soft);color:var(--accent);vertical-align:1px}
.row2{display:flex;gap:6px;flex-wrap:wrap}
.limits{width:100%;border-collapse:collapse;font-size:12px}
.limits td{padding:5px 0;border-top:1px solid var(--line);vertical-align:top}
.limits td:first-child{font-weight:600;width:56px}
.limits td:last-child{color:var(--muted)}

/* switches */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.sw{appearance:none;width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(12px)}
.ck,.field>label.ck{display:flex;align-items:center;justify-content:flex-start;gap:8px;cursor:pointer;color:var(--fg);font-size:13px}
.show-sm{display:none}
.ck input{margin:0;accent-color:var(--accent);width:15px;height:15px}

/* format list */
.mgroup{display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;gap:8px;padding:8px 0 4px;font-weight:600;font-size:12.5px;cursor:pointer}
.mhead .avg{margin-left:auto;font:500 11px var(--f-mono);color:var(--faint)}
.lrow{display:grid;grid-template-columns:16px 20px minmax(0,1fr) auto auto;align-items:center;gap:6px;padding:4px 6px;margin:0 -6px;border-radius:5px;cursor:pointer}
.lrow:hover{background:var(--ui2)}
.lrow.sel{background:var(--accent-soft)}
.lrow.off{opacity:.45}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .sz{font:11px var(--f-mono);color:var(--faint)}
.lrow input{margin:0;accent-color:var(--accent)}
.lrow .del{width:20px;height:20px;border:0;background:transparent;border-radius:4px;color:var(--faint);display:grid;place-items:center;padding:0}
.lrow .del:hover{background:var(--line);color:var(--fail)}
.ovr{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:4px;vertical-align:1px}
.ctag{font:600 9.5px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-left:5px}

/* score chip */
.chip{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 4px;border-radius:4px;color:#fff;font:700 11px/1 var(--f-mono)}
.s5{background:var(--s5)}.s4{background:var(--s4)}.s3{background:var(--s3)}.s2{background:var(--s2)}.s1{background:var(--s1)}.s0{background:var(--faint)}

/* canvas */
#viewport{position:relative;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);touch-action:none;cursor:default;user-select:none;-webkit-user-select:none}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;--z:1}
.sec{position:absolute;background:var(--section);border:1px solid var(--section-line);border-radius:28px}
.sec-title{position:absolute;left:80px;top:34px;font:600 46px/1 var(--f-ui);color:var(--muted);letter-spacing:-.01em;white-space:nowrap}
.sec-title span{font:500 30px var(--f-mono);color:var(--faint);margin-left:18px}
.fw{position:absolute}
.flabel{position:absolute;left:0;bottom:100%;margin-bottom:min(calc(7px / var(--z)),24px);display:flex;align-items:center;gap:min(calc(6px / var(--z)),20px);font-size:min(calc(11.5px / var(--z)),68px);line-height:1.2;white-space:nowrap;color:var(--muted);max-width:100%;overflow:hidden}
.flabel b{font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.flabel .chip{font-size:min(calc(10.5px / var(--z)),62px);min-width:min(calc(18px / var(--z)),106px);height:min(calc(16px / var(--z)),94px);padding:0 min(calc(4px / var(--z)),24px);border-radius:min(calc(4px / var(--z)),24px);flex:none}
.flabel .mono{color:var(--faint);flex:0 50 auto;min-width:0;overflow:hidden}
.frame{position:relative;width:100%;height:100%;box-shadow:0 1px 2px rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,.08)}
.fw:hover .frame{outline:calc(1.5px / var(--z)) solid var(--accent)}
.fw.sel .frame{outline:calc(2px / var(--z)) solid var(--accent)}
.fw.sel .flabel b{color:var(--accent)}
.fw.sel.mv .frame [data-el]{cursor:move}
.fw.sel.mv .frame [data-el]:hover{outline:calc(1px / var(--z)) dashed var(--accent);outline-offset:calc(1px / var(--z))}
.fw.sel .frame [data-el].elsel{outline:calc(2px / var(--z)) solid var(--accent)!important;outline-offset:calc(2px / var(--z))}
.showboxes .fw.mv .frame [data-el]{outline:calc(1px / var(--z)) dashed rgba(11,133,230,.75)}
#world.tiny .flabel{display:none}
.frame [contenteditable]{outline:calc(2px / var(--z)) dashed var(--accent)!important;outline-offset:2px;cursor:text;user-select:text;-webkit-user-select:text;-webkit-line-clamp:unset!important;display:block!important}
.seltb{position:absolute;z-index:8;display:flex;gap:2px;padding:3px;border-radius:8px;background:var(--fg);color:var(--ui);box-shadow:var(--shadow);user-select:none}
.seltb button{height:28px;padding:0 9px;border:0;border-radius:5px;background:transparent;color:inherit;font-size:12px;font-weight:600;white-space:nowrap}
.seltb button:hover{background:rgba(127,127,127,.3)}
.seltb button[disabled]{opacity:.4;cursor:not-allowed}
.seltb .sep{width:1px;margin:4px 2px;background:currentColor;opacity:.25}
.inedit{position:absolute;z-index:9;margin:0;padding:3px;border:0;border-radius:4px;outline:2px solid var(--accent);outline-offset:0;resize:none;overflow:hidden;box-sizing:border-box;caret-color:var(--accent);user-select:text;-webkit-user-select:text;touch-action:auto;box-shadow:0 0 0 9999px rgba(0,0,0,.08)}
.hint{position:absolute;left:12px;bottom:12px;font-size:11.5px;color:var(--muted);background:var(--ui);border:1px solid var(--line);border-radius:6px;padding:5px 9px;pointer-events:none;max-width:calc(100% - 24px)}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}

/* right panel */
.rp-title{display:flex;flex-direction:column;gap:2px}
.eyebrow{font:600 10.5px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.rp-title h2{margin:2px 0 0;font:600 17px/1.25 var(--f-ui);text-wrap:balance}
.score{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:8px;background:var(--ui2)}
.score .num{width:56px;height:56px;border-radius:8px;display:grid;place-items:center;color:#fff;font:700 28px/1 var(--f-mono)}
.score .lbl{font-weight:600}
.pips{display:flex;gap:3px;margin-top:6px}
.pips i{width:18px;height:5px;border-radius:2px;background:var(--line)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.checks li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;align-items:start}
.checks .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 11px/1 var(--f-mono);margin-top:1px}
.checks .pass .ic{background:var(--pass)} .checks .warn .ic{background:var(--warn)} .checks .fail .ic{background:var(--fail)} .checks .info .ic{background:var(--info)}
.checks b{font-weight:600}
.checks span{color:var(--muted)}
.meters{display:flex;flex-direction:column;gap:9px}
.meter .top2{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.meter .bar{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.meter .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.meter .bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.35}
.tips{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:5px;color:var(--muted)}
.tips li::marker{color:var(--faint)}
.note{font-size:12px;color:var(--muted);background:var(--ui2);border-radius:6px;padding:8px 10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.flabel2{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.cnt{font:11px var(--f-mono);color:var(--faint);white-space:nowrap}
.cnt.warn{color:var(--warn)} .cnt.fail{color:var(--fail)}
.inp{width:100%;min-width:0;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--ui);padding:0 8px}
select.inp{padding:0 4px}
textarea.inp{height:auto;min-height:58px;padding:6px 8px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:2px;border-radius:7px;background:var(--ui2);border:1px solid var(--line)}
.seg button{flex:1 1 auto;height:26px;padding:0 8px;border:0;border-radius:5px;background:transparent;font-size:12px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ui);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.colorf{display:flex;align-items:center;gap:6px;height:30px;border:1px solid var(--line);border-radius:6px;padding:0 6px}
.colorf input[type=color]{width:22px;height:22px;border:0;padding:0;background:none;flex:none;cursor:pointer}
.colorf span{font:12px var(--f-mono);color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.dist{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.dist i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.attn{display:flex;flex-direction:column;gap:2px}
.attn button{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;text-align:left;border:0;background:transparent;padding:6px;margin:0 -6px;border-radius:6px}
.attn button:hover{background:var(--ui2)}
.attn .t{font-weight:600}
.attn .d{display:block;color:var(--muted);font-size:12px}
.wtable{width:100%;border-collapse:collapse;font-size:12px}
.wtable td{padding:3px 0;border-bottom:1px solid var(--line)}
.wtable td:last-child{text-align:right;font-family:var(--f-mono)}
.els{display:flex;flex-direction:column;gap:2px}
.elrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:6px;padding:3px 6px 3px 2px;margin:0 -6px 0 -2px;border-radius:6px;cursor:pointer}
.elrow:hover{background:var(--ui2)}
.elrow.on{background:var(--accent-soft)}
.elrow.hid span:not(.cnt){opacity:.45;text-decoration:line-through}
.eye{width:26px;height:26px;border:0;border-radius:5px;background:transparent;display:grid;place-items:center;color:var(--muted)}
.eye:hover{background:var(--line)}

/* site preview */
#preview{background:var(--canvas);overflow:auto;display:flex;flex-direction:column}
.pvbar{position:sticky;top:0;left:0;z-index:5;background:var(--ui);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;padding-block:10px}
.pvbar .field{flex:1 1 150px;max-width:260px}
.pvbar .field.url{flex:2 1 240px;max-width:420px}
.pvbar .field.fixed{flex:none;max-width:none}
.pvbar .seg{flex-wrap:nowrap}
.pvstage{padding:24px 16px 48px;display:flex;justify-content:center;align-items:flex-start;flex:1}
.pvwrap{position:relative;flex:none}
.pvscale{transform-origin:0 0;position:absolute;left:0;top:0}
.pvad{position:relative;cursor:pointer;margin:0 auto}
.pvad:hover{outline:2px solid #0b85e6;outline-offset:2px}
.pvad.on{outline:3px solid #0b85e6;outline-offset:2px}
.pvfree{position:absolute;cursor:move;touch-action:none}
.pvx{position:absolute;right:-10px;top:-10px;width:22px;height:22px;border-radius:50%;border:0;background:#15181d;color:#fff;font:700 13px/1 Arial;display:grid;place-items:center;z-index:3;padding:0}
.pvnote{font-size:12px;color:var(--muted);flex-basis:100%}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,14,20,.5);display:grid;place-items:center;z-index:60;padding:16px}
.mbox{width:min(860px,100%);max-height:calc(100% - 32px);background:var(--ui);border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.mbox header,.mbox footer{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.mbox footer{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;flex-wrap:wrap}
.mbox h4{margin:0;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbox textarea{flex:1;min-height:320px;border:0;background:var(--ui2);padding:12px 14px;font:12px/1.5 var(--f-mono);resize:none;white-space:pre;overflow:auto}
.mbox textarea:focus{outline:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--ui);padding:9px 14px;border-radius:7px;font-size:12.5px;box-shadow:var(--shadow);z-index:70;max-width:calc(100% - 32px)}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,44%)}
  #right{border-left:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .hide-md{display:none!important}
  .hint{display:none}
}
@media (max-width:560px){ .mark small,.hide-sm{display:none!important} .show-sm{display:inline} .btn{padding:0 9px} .zoom output{min-width:38px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <header class="top gut">
    <div class="mark">

function iabGrid(w,h){const k=w*h*4/1000;

function restoreSnap(s){const d=JSON.parse(s);state.content=d.c;state.overrides=d.o;state.weights={};renderCanvas();renderRight();renderMenu();schedulePreview();syncUndo();}

/* ================= QR ================= */
const qrCache={};
function qrFor(text){
  text=String(text||'https://example.com');
  if(qrCache[text])return qrCache[text];
  let url='';
  try{ if(window.QRCode){const d=document.createElement('div');new QRCode(d,{text,width:256,height:256,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});const c=d.querySelector('canvas');if(c)url=c.toDataURL('image/png');}}catch(e){}
  if(!url){let s='';let seed=text.length*97+7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
    const fin=(x,y)=>{const inF=(ox,oy)=>x>=ox&&x<ox+7&&y>=oy&&y<oy+7;for(const [ox,oy] of [[0,0],[18,0],[0,18]])if(inF(ox,oy)){const dx=x-ox,dy=y-oy;return (dx===0||dx===6||dy===0||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4))?1:0;}return -1;};
    for(let y=0;y<25;y++)for(let x=0;x<25;x++){const v=fin(x,y);if(v===1||(v===-1&&rnd()>.5))s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}
    url='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 29 29" shape-rendering="crispEdges"><rect x="-2" y="-2" width="29" height="29" fill="#fff"/><g fill="#000">${s}</g></svg>`);}
  return qrCache[text]=url;
}

/* ================= scoring ================= */
const SCORE_LBL={5:'Ready to deliver',4:'Good, minor tweaks',3:'Needs fixes',2:'At risk of rejection',1:'Will not deliver'};
function wKey(f,p){return `${state.asset?state.asset.ver:0}|${p.fit}|${p.fx}|${p.fy}|${p.bg}`;}
function evaluate(f){
  const p=props(f),a=state.asset,m=state.measures[f.id]||{},C=[];let cap=5,crit=0;
  const add=(st,label,detail,isCrit)=>{C.push({st,label,detail});if(st==='fail'){if(isCrit){crit++;cap=Math.min(cap,2);}else cap=Math.min(cap,3);}};
  const at=a?a.type:null;
  if(!a)add('fail','Media','No creative uploaded.',true);
  else if(f.media==='audio')at==='audio'?add('pass','Media type','Audio file fits the linear audio slot.'):add('fail','Media type',`Needs an MP3, AAC or OGG audio file. Your ${at} is used as the companion banner only.`,true);
  else if(f.media==='video'){if(at==='video')add('pass','Media type','Video file fits this video slot.');else add('fail','Media type',at==='image'?'Video-only slot: the player rejects still images. Upload MP4 or MOV.':'Video slot: audio-only files are rejected.',true);}
  else if(f.media==='image'){if(at==='image')add('pass','Media type','Static image fits this slot.');else if(at==='video')add('warn','Media type',f.kSub?'Video in a banner is host-initiated subload; it must start after the page load event.':'Static slot: only the first video frame is used.');else add('fail','Media type','Needs an image; audio cannot run here.',true);}
  else{if(at==='audio')add('fail','Media type','Needs an image or video.',true);else add('pass','Media type',at==='video'?'Video accepted (motion slot).':'Image accepted; runs as a still.');}
  if(at==='image'||at==='video'){
    const b=imgBox(f),dn=f.dens||1,nW=Math.round(b.w*dn),nH=Math.round(b.h*dn);
    const aAR=a.w/a.h,tAR=b.w/b.h,crop=1-Math.min(aAR,tAR)/Math.max(aAR,tAR),pct=Math.round(crop*100);
    if(crop<=.05)add('pass','Aspect ratio',`${ratioName(a.w,a.h)} source matches the ${ratioName(b.w,b.h)} frame.`);
    else if(p.fit==='contain')add(crop>.3?'warn':'pass','Aspect ratio',`Letterboxed: ${pct}% of the frame is background colour.`);
    else if(crop<=.3)add('warn','Aspect ratio',`Crops ${pct}% of the image. Check the focal point.`);
    else add('fail','Aspect ratio',`Crops ${pct}% of the image. Supply a ${ratioName(b.w,b.h)} version, or switch to Fit.`);
    if(a.vector)add('pass','Resolution','Vector source scales to any size.');
    else{const sc=p.fit==='contain'?Math.min(nW/a.w,nH/a.h):Math.max(nW/a.w,nH/a.h);
      const need=`${nW}×${nH}${dn>1?(f.tpl==='tv'?' (4K UHD)':' (2× density)'):''}`;
      if(sc<=1.001)add('pass','Resolution',`${a.w}×${a.h} covers ${need}.`);
      else if(sc<=1.4)add('warn','Resolution',`Upscaled ${sc.toFixed(1)}× to reach ${need}; slightly soft.`);
      else add('fail','Resolution',`Upscaled ${sc.toFixed(1)}×, visibly blurry. Needs ${need}.`,sc>2);}
  } else if(at==='audio'&&f.tpl==='audio')add('info','Companion','No companion image uploaded, so a brand tile is generated.');
  if(f.kInit&&a){const lim=f.kInit,raw=a.bytes/1024;
    if(at==='image'){const w=state.weights[f.id];
      if(!w||w.key!==wKey(f,p)){add('info','File weight','Calculating optimised weight…');queueWeights();}
      else{const tot=r1(w.kb+HTML_KB),rawT=r1(raw+HTML_KB),g3=r1(lim*.7);
        if(rawT<=lim)add('pass','File weight',`${rawT} kB, under the ${lim} kB initial-load limit.`);
        else if(tot<=lim)add('pass','File weight',`Raw ${fmtKB(raw)} → ${tot} kB after auto-optimise (limit ${lim} kB)${tot>g3?`. Above the ${g3} kB 3G target.`:'.'}`);
        else if(tot<=lim*1.25)add('warn','File weight',`${tot} kB after optimising, over the ${lim} kB limit. Simplify the image.`);

    else if(at==='video'){const s=f.kSub||lim*2;raw<=s?add('warn','File weight',`Video ${fmtKB(raw)} fits the ${s} kB subload; still needs a static backup under ${lim} kB.`):add('fail','File weight',`Video ${fmtKB(raw)} exceeds the ${s} kB subload. Make playback user-initiated (tap to play).`);}

    else add('pass','Duration',`${dv.toFixed(1)}s, within ${exact?':'+mx:mn+'–'+mx+'s'}.`);
  } else if(f.sec&&at==='image'&&f.media==='any')add('info','Duration',`Runs as a still for the ${f.sec[1]}s slot.`);
  const TL=(label,val,lim)=>{if(!lim)return;const n=chars(val),[s,h]=lim;if(!n){add('warn',label,`No ${label.toLowerCase()} set.`);return;}
    if(n<=s)add('pass',label,`${n}/${s} characters.`);else if(n<=h)add('warn',label,`${n} characters; ${s} recommended, ${h} max. May truncate.`);else add('fail',label,`${n}/${h} characters max. The platform cuts it.`);};

    if(!n)add('warn','Script','No audio script entered.');else if(n>h)add('fail','Script',`${n} words ≈ ${secs.toFixed(0)}s read. Too long for :${L}.`);else if(n>s)add('warn','Script',`${n} words; tight for :${L} (about ${s}).`);else if(n<s*.6)add('warn','Script',`${n} words fills only ~${secs.toFixed(0)}s of a :${L} spot.`);else add('pass','Script',`${n} words ≈ ${secs.toFixed(0)}s at 2.5 words per second.`);}

  if(f.words){const cs=ctaStyle(p,f);const n=(hid(p,'headline')?0:words(p.headline))+(f.body&&!hid(p,'body')?words(p.body):0)+(cs!=='none'&&cs!=='qr'&&!hid(p,'cta')?words(p.cta):0);
    n<=f.words?add('pass','Word count',`${n} words; max ${f.words} for this dwell time.`):add(n>f.words*1.5?'fail':'warn','Word count',`${n} words. Viewers read ${f.words} at most here.`);}
  const cs=hid(p,'cta')?'none':ctaStyle(p,f);
  if(f.ctaKind==='platform'){if(f.ctaList){const ok=f.ctaList.some(c=>c.toLowerCase()===String(p.cta).trim().toLowerCase());ok?add('pass','CTA button',`"${p.cta}" is a ${PLAT[f.plat]} button option.`):add('warn','CTA button',`"${p.cta}" is not a ${PLAT[f.plat]} button. Pick e.g. ${f.ctaList.slice(0,4).join(', ')}.`);}else add('pass','CTA button','Rendered by YouTube from your CTA text.');}
  else if(f.ctaKind==='button'){if(cs==='none')add('warn','CTA','No CTA. Clickable slots respond better with one.');else if(cs==='qr')add('warn','CTA','Clickable slot: a button converts better than a QR code.');
    else if(cs==='pill'||cs==='square'){const cr=contrast(p.ctaBg,p.ctaFg);cr>=4.5?add('pass','CTA contrast',`${cr.toFixed(1)}:1 button contrast.`):add('warn','CTA contrast',`${cr.toFixed(1)}:1 button contrast; aim for 4.5:1.`);}
    else add('pass','CTA',`${cs==='link'?'Text link':'Outline button'} CTA.`);}
  else if(f.ctaKind==='qr'){cs==='qr'?add('pass','CTA','QR code gives this non-clickable screen a response path.'):cs==='none'?add('warn','CTA','No response path. Add a QR code.'):add('warn','CTA','Screen is not clickable; a button can\'t be pressed. Use a QR code.');}
  else{if(cs==='none')add('pass','CTA','No button needed; the placement is not clickable.');else if(cs==='qr'&&f.tpl==='dooh')add('warn','CTA','Road viewers can\'t scan at speed. Remove the QR code.');else if(cs==='qr')add('warn','CTA','QR code is too small to scan in this placement.');else add('warn','CTA','Placement is not clickable. Remove the button.');}
  if(m.hlPx&&f.minFont&&m.hlPx<f.minFont-.5)add('warn','Legibility',`Headline renders at ${r1(m.hlPx)}px; ${f.minFont}px is the minimum here.`);
  if(m.hlOverflow)add('warn','Text fit','Headline is cut off at this size. Shorten it or edit this format only.');
  if(m.bodyOverflow)add('warn','Text fit','Body copy is cut off at this size.');
  if(m.dropped)add('info','Text fit','Body copy hidden: not enough room at this size.');
  if(m.overlaps&&m.overlaps.length)add('fail','Overlap',m.overlaps.map(([x,y])=>`${elName(x)} overlaps ${elName(y).toLowerCase()}`).join('; ')+'. Drag them apart in the frame or shorten the copy.');
  if(m.outside&&m.outside.length)add('warn','Out of frame',`${m.outside.map(elName).join(', ')} ${m.outside.length>1?'are':'is'} partly outside the frame.`);
  if(m.inSafe&&m.inSafe.length)add('warn','Safe zone',`${m.inSafe.map(elName).join(', ')} ${m.inSafe.length>1?'sit':'sits'} in the keep-clear zone and may be covered by platform UI.`);

/* ================= image crops & weights ================= */
async function cropTo(W,H,p,type='image/jpeg',q=.82){
  const mx=Math.max(W,H);if(mx>8192){const s=8192/mx;W=Math.round(W*s);H=Math.round(H*s);}
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle=p.bg;g.fillRect(0,0,W,H);
  const a=state.asset;
  if(a&&a.el&&(a.type==='image'||a.type==='video')){const sw=a.w,sh=a.h,sc=p.fit==='contain'?Math.min(W/sw,H/sh):Math.max(W/sw,H/sh),dw=sw*sc,dh=sh*sc;
    try{g.drawImage(a.el,(W-dw)*(p.fx/100),(H-dh)*(p.fy/100),dw,dh);}catch(e){}}
  else{const gr=g.createRadialGradient(W*.25,H*.2,0,W*.25,H*.2,Math.max(W,H)*.9);gr.addColorStop(0,p.ctaBg);gr.addColorStop(.62,p.bg);gr.addColorStop(1,p.bg);g.fillStyle=gr;g.fillRect(0,0,W,H);}

    if(!state.chOn.has(ch))continue;const fs=FORMATS.filter(f=>f.ch===ch&&!state.fOff.has(f.id));if(!fs.length)continue;
    const fr=[];let y=SEC_HEAD,x=0,rowH=0,maxX=0;

      fr.push({f,x,y:y+LABEL,w:d.w,h:d.h});x+=d.w+GAP;maxX=Math.max(maxX,x-GAP);rowH=Math.max(rowH,d.h);}

  }
  const cols=blocks.length>4?3:blocks.length>1?2:1,colW=MAXW+2*PAD+SEC_GAP,colH=Array(cols).fill(0),frames=[],secs=[];
  for(const b of blocks){const c=colH.indexOf(Math.min(...colH)),ox=c*colW,oy=colH[c];

async function loadAsset(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  const type=/^video\//.test(file.type)||['mp4','mov','webm','m4v'].includes(ext)?'video':/^audio\//.test(file.type)||['mp3','wav','ogg','m4a','aac'].includes(ext)?'audio':/^image\//.test(file.type)||['jpg','jpeg','png','gif','webp','svg'].includes(ext)?'image':null;
  if(!type||(type==='image'&&/tiff|bmp|heic|heif/.test(file.type))){toast(`Unsupported file. Use ${LIMITS.image.ext}, ${LIMITS.video.ext}, or ${LIMITS.audio.ext}.`,5000);return;}
  const L=LIMITS[type];
  if(file.size>L.mb*1048576){toast(`That ${type} is ${fmtKB(file.size/1024)}. The upload limit is ${L.mb} MB; compress it or upload a shorter cut.`,6000);return;}
  toast('Reading '+file.name+'…',0);
  const url=URL.createObjectURL(file),a={type,url,file,name:file.name,bytes:file.size,mime:file.type,ver:Date.now()};
  try{
    if(type==='image'){const img=new Image();img.src=url;await img.decode();a.w=img.naturalWidth||1200;a.h=img.naturalHeight||1200;a.el=img;a.vector=/svg/.test(file.type)||ext==='svg';
      if(!a.vector){if(Math.max(a.w,a.h)>L.maxPx){toast(`That image is ${a.w}×${a.h}px. The limit is ${L.maxPx.toLocaleString()}px per side.`,6000);return;}
        if(Math.min(a.w,a.h)<L.minPx){toast(`That image is ${a.w}×${a.h}px. Use at least ${L.minPx}px per side.`,6000);return;}}}
    else if(type==='video'){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;await once(v,'loadedmetadata');a.w=v.videoWidth;a.h=v.videoHeight;a.dur=v.duration;
      if(a.dur>L.sec){toast(`That video runs ${Math.round(a.dur)}s. The limit is ${L.sec/60} minutes.`,6000);return;}
      try{v.currentTime=Math.min(1,(a.dur||2)/2);await once(v,'seeked',8000);}catch{}a.el=v;}
    else{const au=new Audio();au.preload='metadata';au.src=url;await once(au,'loadedmetadata');a.dur=au.duration;
      if(a.dur>L.sec){toast(`That audio runs ${Math.round(a.dur)}s. The limit is ${L.sec/60} minutes.`,6000);return;}
      try{const C=window.AudioContext||window.webkitAudioContext;const ac=new C();const ab=await ac.decodeAudioData(await file.arrayBuffer());const ch=ab.getChannelData(0),n=90,step=Math.floor(ch.length/n),pk=[];for(let i=0;i<n;i++){let m=0;for(let j=i*step;j<(i+1)*step;j+=64)m=Math.max(m,Math.abs(ch[j]||0));pk.push(m);}const mx=Math.max(...pk,.01);a.peaks=pk.map(v=>v/mx);ac.close();}catch{}}
  }catch(err){toast(`Couldn't read ${file.name}: ${err.message}`,5000);return;}
  state.asset=a;state.sample=false;state.weights={};
  renderCanvas();renderRight();renderMenu();schedulePreview();toast(`Loaded ${file.name} · ${a.w?a.w+'×'+a.h:''}${a.dur?' · '+a.dur.toFixed(1)+'s':''}`);
  if(type!=='image')inspectAsset(a);
}

/* --- first frame and burned-in bars, sampled to a small canvas --- */

    const bars={t:1,b:1,l:1,r:1};let seen=false;
    for(const q of [.3,.5,.7]){const L=await grab((a.dur||1)*q);let fm=0;for(const x of L)if(x>fm)fm=x;if(fm<.2)continue;seen=true;
      const dark=(x0,y0,x1,y1)=>{for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)if(L[y*W+x]>=.09)return false;return true;};
      let t=0;while(t<H/2&&dark(0,t,W,t+1))t++;let b=0;while(b<H/2&&dark(0,H-1-b,W,H-b))b++;
      let l=0;while(l<W/2&&dark(l,0,l+1,H))l++;let r=0;while(r<W/2&&dark(W-1-r,0,W-r,H))r++;
      bars.t=Math.min(bars.t,t/H);bars.b=Math.min(bars.b,b/H);bars.l=Math.min(bars.l,l/W);bars.r=Math.min(bars.r,r/W);}

/* --- integrated loudness (ITU-R BS.1770-4, gated) and sample peak, decoded at 48 kHz --- */

    for(let s=0;s<nSeg;s++){let acc=0;const e=(s+1)*hop;for(let i=s*hop;i<e;i++){const v=x[i],av=v<0?-v:v;if(av>peak)peak=av;
        const y=1.53512485958697*v-2.69169618940638*x1+1.19839281085285*x2+1.69065929318241*y1-.73248077421585*y2;x2=x1;x1=v;y2=y1;y1=y;
        const z=y-2*u1+u2+1.99004745483398*z1-.99007225036621*z2;u2=u1;u1=y;z2=z1;z1=z;acc+=z*z;}
      seg[s]+=acc;}
    for(let i=nSeg*hop;i<x.length;i++){const av=Math.abs(x[i]);if(av>peak)peak=av;}
    await new Promise(r=>setTimeout(r));}

  for(let s=0;s+4<=nSeg;s++)blocks.push((seg[s]+seg[s+1]+seg[s+2]+seg[s+3])/(4*hop));

  const rel=lk(g.reduce((s,m)=>s+m,0)/g.length)-10;g=g.filter(m=>lk(m)>rel);
  return {i:lk(g.reduce((s,m)=>s+m,0)/g.length),peak:pk,ch:buf.numberOfChannels};

/* --- runs after a video or audio upload; each step re-scores as it lands --- */
async function inspectAsset(a){
  const I=a.insp={pending:true};
  const refresh=()=>{if(state.asset!==a)return;state.evals={};updateScores();if(openMenu==='creative')renderMenu();};
  try{Object.assign(I,await parseMP4(a.file));}catch(e){I.err='Could not read the file structure: '+e.message;}
  if(I.video&&!I.video.kbps&&a.dur){I.video.kbps=Math.max(0,a.bytes*8/a.dur/1000-(I.audio&&I.audio.kbps||0));I.video.est=true;}
  if(!I.mp4&&a.type==='audio'){const ext=(a.name.split('.').pop()||'').toUpperCase();I.audio={codec:{M4A:'AAC',AAC:'AAC',OGG:'Vorbis / Opus',WAV:'PCM'}[ext]||ext,kbps:a.dur?a.bytes*8/a.dur/1000:0,est:true};}
  I.pending=false;refresh();
  if(a.type==='video'){try{I.frames=await sampleFrames(a);}catch{I.frames=null;}refresh();}
  if(I.mp4&&!I.audio){I.loud=null;I.loudErr='No audio track to measure.';}
  else if(a.bytes>150*1048576){I.loud=null;I.loudErr='Loudness is measured for files up to 150 MB.';}
  else{try{const r=await measureLoudness(a.file);I.loud={i:r.i,peak:r.peak};if(I.audio&&!I.audio.ch)I.audio.ch=r.ch;}catch{I.loud=null;I.loudErr='This browser could not decode the audio track.';}}
  refresh();
}

/* --- checks: audio track and loudness --- */
function audioFileChecks(I){
  const o=[],add=(...c)=>o.push(c),au=I.audio,L=LOUD[state.loud];
  if(au){const iss=[];
    if(au.codec!=='AAC-LC')iss.push(`use AAC-LC instead of ${au.codec}`);
    if(au.kbps&&(au.kbps<120||au.kbps>200))iss.push('use 128–192 kbps');
    if(au.ch&&au.ch!==2)iss.push('use stereo');
    if(au.sr&&au.sr!==44100&&au.sr!==48000)iss.push('use 44.1 or 48 kHz');
    const desc=[au.codec,au.kbps?`${kbpsTxt(au.kbps)} kbps`:'',au.ch?(au.ch===2?'stereo':au.ch===1?'mono':au.ch+' channels'):'',au.sr?`${r1(au.sr/1000)} kHz`:''].filter(Boolean).join(' · ');
    iss.length?add('warn','Audio codec',`${desc}. IAB: ${iss.join(', ')}.`):add('pass','Audio codec',`${desc}.`);}
  if(I.loud===undefined)add('info','Loudness','Measuring integrated loudness…');

    else if(Math.abs(dv)<=L.tol)add('pass','Loudness',`${v.toFixed(1)} ${L.unit}, within ${L.target} ±${L.tol} (${L.label}, ${L.std}).`);
    else add('warn','Loudness',`${v.toFixed(1)} ${L.unit} is ${Math.abs(dv).toFixed(1)} dB ${dv>0?'too loud':'too quiet'} for ${L.target} ±${L.tol} (${L.label}, ${L.std}). The encoding commands normalise it.`);

  return o;
}
/* --- checks: video file against the IAB DV & CTV 2022 guidelines --- */
function videoFileChecks(f,a){
  const o=[],add=(...c)=>o.push(c),I=a.insp;
  if(!I||I.pending){add('info','File inspection','Reading the file structure…');return o;}
  if(I.err&&!I.video)add('info','File inspection',I.err);
  if(I.mp4===false)add('warn','Container',`${I.container} source. Players need MP4 (H.264 + AAC); the encoding commands make the renditions.`);
  if(I.mp4){
    add(I.faststart?'pass':'warn','Web-optimised',I.faststart?'MOOV atom at the start: playback begins before the download finishes.':'MOOV atom after the media data. Re-mux with -movflags +faststart.');
    const v=I.video;
    if(!v)add('fail','Video codec','No video track found.',true);
    else{
      if(v.codec==='H.264'){const okP=v.profile==='Main'||v.profile==='High',okL=!v.level||v.level<=4.2;
        add(okP&&okL?'pass':'warn','Video codec',`H.264 ${v.profile||''} @ level ${v.level||'?'}.${okP?'':' Use Main or High profile.'}${okL?'':' Many players and TVs stop at level 4.2.'}`);}
      else add(v.codec==='HEVC'||/ProRes/.test(v.codec)?'warn':'fail','Video codec',`${v.codec}. Serve H.264 (Main or High) renditions${/ProRes|HEVC/.test(v.codec)?`; keep ${v.codec} as the mezzanine`:''}.`);
      if(v.fps){const fr=v.fps;
        if(fr>=23.9&&fr<=30.01)add('pass','Frame rate',`${fmtFps(fr)} fps, native rate within 24–30.`);
        else if(fr>30.01)add('warn','Frame rate',`${fmtFps(fr)} fps. Serve renditions at ${fmtFps(fr/2)} fps (native rate, 30 fps max).`);
        else add('warn','Frame rate',`${fmtFps(fr)} fps is under 24; motion may stutter.`);}
      if(v.kbps){const [,lo,hi]=bandFor(v.h),k=v.kbps,res=`${v.h}p`;
        if(k>=lo&&k<=hi)add('pass','Bitrate',`${kbpsTxt(k)} kbps${v.est?' (estimated)':''}, inside the ${kbpsTxt(lo)}–${kbpsTxt(hi)} kbps target for ${res}.`);
        else if(k>hi)add(f.ch==='ctv'?'info':'warn','Bitrate',`${kbpsTxt(k)} kbps${v.est?' (estimated)':''}, above the ${kbpsTxt(hi)} kbps ceiling for ${res}. ${f.ch==='ctv'?'Fine as a mezzanine; serve':'Serve'} the renditions from the encoding commands.`);
        else add('warn','Bitrate',`${kbpsTxt(k)} kbps${v.est?' (estimated)':''}, under the ${kbpsTxt(lo)} kbps floor for ${res}; expect visible artefacts.`);}
    }
    if(!I.audio)add('warn','Audio codec','No audio track. Players expect stereo AAC-LC, even when silent.');
  }
  if(I.audio||!I.mp4)o.push(...audioFileChecks(I));
  if(I.frames===undefined)add('info','Black leader','Checking the opening frame…');
  else if(I.frames){
    I.frames.lead?add('warn','Black leader',`Opens on a ${I.frames.lead}. Deliver without black leader or slate; the player adds its own.`):add('pass','Black leader','Opens on picture: no black leader or slate.');
    I.frames.bars?add('warn','Letterbox / pillarbox',`Burned-in ${I.frames.bars} (${I.frames.barPct}% of the frame). Deliver full-frame ${ratioName(f.w,f.h)}.`):add('pass','Letterbox / pillarbox','No burned-in bars.');}
  if(f.ch==='ctv'){const v=I.video;
    v&&v.kbps>=15000&&v.h>=1080?add('pass','Mezzanine',`${r1(v.kbps/1000)} Mbps ${v.h}p source can serve as the mezzanine.`):add('warn','Mezzanine','Also deliver a mezzanine (ProRes 422 HQ, or H.264 at 15 Mbps+, 1080p or above) so the SSAI server can transcode. The VAST tag references it.');}
  return o;
}
/* --- everything the v2 formats add to evaluate() --- */
function v2Checks(f,p,a){
  const o=[],add=(...c)=>o.push(c),at=a?a.type:null;
  if(f.durs&&at==='video'&&a.dur&&isFinite(a.dur)){const d=a.dur,hit=f.durs.find(x=>Math.abs(d-x)<=1),lbl=x=>':'+String(x).padStart(2,'0');
    hit!==undefined?add('pass','Duration',`${d.toFixed(1)}s matches ${lbl(hit)} (±1s).`):add('fail','Duration',`${d.toFixed(1)}s. IAB lengths for this slot: ${f.durs.map(lbl).join(', ')}, each ±1s.`,true);}
  if(f.rend&&at==='video')o.push(...videoFileChecks(f,a));
  if(f.flex)add('info','Transition size',f.trans?`Also supply the ${f.trans} fixed size for publishers not yet on flexible units.`:'No fixed-size equivalent; serve only where flexible units are supported.');
  if(f.nonlinear)add('pass','Overlay rules',`${f.h}px tall, so it stays within 1/5 of players ${f.h*5}px tall or more. Close button, "Advertisement" label and a 70% background are built in.`);
  if(f.compUnit)add('info','Companion','Delivered inside the linear VAST tag as a static image; no video or audio.');
  if(f.tpl==='lshape')add('info','L-shape','The programme keeps a 70% window top right. Copy sits in the left column and the bottom band.');
  return o;
}

/* --- File inspection panel (Creative menu) --- */
function inspHTML(){
  const a=state.asset;if(!a||a.type==='image'||!a.insp)return '';const I=a.insp,L=LOUD[state.loud],rows=[];
  const R=(k,v)=>rows.push(`<tr><td>${k}</td><td>${v}</td></tr>`);
  if(I.pending)return `<div class="psec"><h3>File inspection</h3><div class="muted small">Reading the file…</div></div>`;
  R('Container',esc(I.container||'Unknown')+(I.mp4?` · ${I.faststart?'web-optimised (MOOV first)':'MOOV at the end'}`:''));
  const v=I.video;
  if(v){R('Video codec',esc(`${v.codec}${v.profile?' '+v.profile:''}${v.level?' @ level '+v.level:''}`));R('Picture',`${v.w}×${v.h}${v.fps?` · ${fmtFps(v.fps)} fps`:''}`);if(v.kbps)R('Video bitrate',`${kbpsTxt(v.kbps)} kbps${v.est?' (estimated)':''}`);}
  const au=I.audio;
  if(au)R('Audio',esc([au.codec,au.kbps?`${kbpsTxt(au.kbps)} kbps${au.est?' (estimated)':''}`:'',au.ch?(au.ch===2?'stereo':au.ch===1?'mono':au.ch+' channels'):'',au.sr?`${r1(au.sr/1000)} kHz`:''].filter(Boolean).join(' · ')));
  else if(I.mp4)R('Audio','No audio track');
  R('Loudness',I.loud===undefined?'Measuring…':I.loud?`${isFinite(I.loud.i)?I.loud.i.toFixed(1)+' '+L.unit:'Silent'} · peak ${I.loud.peak.toFixed(1)} dBFS`:esc(I.loudErr||'Not measured'));
  if(a.type==='video')R('Opening / bars',I.frames===undefined?'Checking…':I.frames?esc(`${I.frames.lead?I.frames.lead+' at the start':'Opens on picture'} · ${I.frames.bars?I.frames.bars+' '+I.frames.barPct+'%':'no bars'}`):'Could not sample frames');
  if(I.err&&!v)R('Note',esc(I.err));
  return `<div class="psec"><h3>File inspection</h3><table class="limits">${rows.join('')}</table><div class="muted small">Read in your browser with File.slice() and the Web Audio API. Nothing is uploaded.</div></div>`;
}

/* --- renditions, VAST and encoding for the v2 linear formats --- */
function renditions(f,a){
  const p=props(f),ar=f.w/f.h,srcH=a&&a.h?a.h:1080,i=LADDER.findIndex(([h])=>h<=srcH),st=Math.min(i<0?LADDER.length-3:i,LADDER.length-3);
  return LADDER.slice(st,st+3).map(([h,kbps,prof,lvl,codec])=>{const w=2*Math.round(h*ar/2);return {w,h,kbps,prof,lvl,codec,file:`${slug(p.brand)}_${slug(f.name)}_${w}x${h}_${kbps}k.mp4`};});
}
const mezzFile=f=>`${slug(props(f).brand)}_${slug(f.name)}_mezzanine.mov`;
const vastBase=()=>String(state.content.cdn||'https://cdn.example.com/creatives/').replace(/\/?$/,'/');
const uaidXML=()=>{const u=state.uaid,v=String(u.val||'').trim();return v?`<UniversalAdId idRegistry="${esc(u.reg||'ad-id.org')}">${esc(v)}</UniversalAdId>`:'<UniversalAdId idRegistry="unknown">unknown</UniversalAdId>';};
function buildVAST(f){
  if(!f.v2)return buildVASTv1(f);
  if(f.nonlinear)return buildNonLinear(f);
  if(!f.rend)return {err:f.compUnit?'Companions ship inside the linear VAST tag. Export Linear 16:9 instead.':'VAST is for video, audio and overlay slots.'};
  const p=props(f),a=state.asset;if(!a||a.type!=='video')return {err:'Upload a video file to build VAST for this slot.'};
  const base=vastBase(),id=`${slug(p.brand)}-${f.id}`,uid=(crypto.randomUUID&&crypto.randomUUID())||Date.now().toString(36);
  const R=renditions(f,a),clickable=f.ch!=='ctv',comps=clickable?(f.comps||[]):[];
  const trk=['start','firstQuartile','midpoint','thirdQuartile','complete','mute','unmute','pause','resume'].map(ev=>`              <Tracking event="${ev}"><![CDATA[https://track.example.com/${ev}?ad=${id}]]></Tracking>`).join('\n');
  const mf=R.map((r,i)=>`              <MediaFile id="media-${i+1}" delivery="progressive" type="video/mp4" width="${r.w}" height="${r.h}" bitrate="${r.kbps}" codec="${r.codec}" scalable="true" maintainAspectRatio="true"><![CDATA[${cd(base+r.file)}]]></MediaFile>`).join('\n');
  const clicks=clickable?`
            <VideoClicks>
              <ClickThrough id="click-1"><![CDATA[${cd(p.url)}]]></ClickThrough>
              <ClickTracking id="ct-1"><![CDATA[https://track.example.com/click?ad=${id}]]></ClickTracking>
            </VideoClicks>`:'';
  const comp=comps.length?`
        <Creative id="${id}-companions" sequence="1">
          ${uaidXML()}
          <CompanionAds required="any">
${comps.map(([w,h],i)=>`            <Companion id="companion-${i+1}" width="${w}" height="${h}" assetWidth="${w}" assetHeight="${h}">
              <StaticResource creativeType="image/jpeg"><![CDATA[${cd(base)}companion_${w}x${h}.jpg]]></StaticResource>
              <CompanionClickThrough><![CDATA[${cd(p.url)}]]></CompanionClickThrough>
              <TrackingEvents><Tracking event="creativeView"><![CDATA[https://track.example.com/companion?ad=${id}&size=${w}x${h}]]></Tracking></TrackingEvents>
            </Companion>`).join('\n')}
          </CompanionAds>
        </Creative>`:'';
  const xml=`<?xml version="1.0" encoding="UTF-8"?>
<VAST version="4.2" xmlns="http://www.iab.com/VAST">
  <Ad id="${id}" sequence="1">
    <InLine>
      <AdSystem version="1.0">Ad Format Studio</AdSystem>
      <Error><![CDATA[https://track.example.com/error?code=[ERRORCODE]&ad=${id}]]></Error>
      <Impression id="impression-1"><![CDATA[https://track.example.com/impression?ad=${id}]]></Impression>
      <AdServingId>${uid}</AdServingId>
      <AdTitle><![CDATA[${cd(p.brand)} | ${cd(f.name)}]]></AdTitle>
      <Advertiser><![CDATA[${cd(p.brand)}]]></Advertiser>
      <Creatives>
        <Creative id="${id}-linear" adId="${id}" sequence="1">
          ${uaidXML()}
          <Linear>
            <TrackingEvents>
${trk}
            </TrackingEvents>
            <Duration>${hms(a.dur||f.sec[1])}</Duration>
            <MediaFiles>
${mf}
              <Mezzanine delivery="progressive" type="video/quicktime" width="${f.w}" height="${f.h}" codec="apch"><![CDATA[${cd(base+mezzFile(f))}]]></Mezzanine>
            </MediaFiles>${clicks}
          </Linear>
        </Creative>${comp}
      </Creatives>
    </InLine>
  </Ad>
</VAST>`;
  return {xml,file:R[0].file};
}
function buildNonLinear(f){
  const p=props(f),a=state.asset;if(!a||a.type!=='image')return {err:'Upload an image to build the overlay tag.'};
  const base=vastBase(),id=`${slug(p.brand)}-${f.id}`,uid=(crypto.randomUUID&&crypto.randomUUID())||Date.now().toString(36),asset=`${slug(p.brand)}_${slug(f.name)}.png`;
  const xml=`<?xml version="1.0" encoding="UTF-8"?>
<VAST version="4.2" xmlns="http://www.iab.com/VAST">
  <Ad id="${id}" sequence="1">
    <InLine>
      <AdSystem version="1.0">Ad Format Studio</AdSystem>
      <Error><![CDATA[https://track.example.com/error?code=[ERRORCODE]&ad=${id}]]></Error>
      <Impression id="impression-1"><![CDATA[https://track.example.com/impression?ad=${id}]]></Impression>
      <AdServingId>${uid}</AdServingId>
      <AdTitle><![CDATA[${cd(p.brand)} | ${cd(f.name)}]]></AdTitle>
      <Advertiser><![CDATA[${cd(p.brand)}]]></Advertiser>
      <Creatives>
        <Creative id="${id}-nonlinear" adId="${id}" sequence="1">
          ${uaidXML()}
          <NonLinearAds>
            <NonLinear id="overlay-1" width="${f.w}" height="${f.h}" expandedWidth="${f.w}" expandedHeight="${f.h}" scalable="true" maintainAspectRatio="true" minSuggestedDuration="00:00:15">
              <StaticResource creativeType="image/png"><![CDATA[${cd(base+asset)}]]></StaticResource>
              <NonLinearClickThrough><![CDATA[${cd(p.url)}]]></NonLinearClickThrough>
              <NonLinearClickTracking id="ct-1"><![CDATA[https://track.example.com/click?ad=${id}]]></NonLinearClickTracking>
            </NonLinear>
            <TrackingEvents>
              <Tracking event="creativeView"><![CDATA[https://track.example.com/creativeView?ad=${id}]]></Tracking>
              <Tracking event="close"><![CDATA[https://track.example.com/close?ad=${id}]]></Tracking>
            </TrackingEvents>
          </NonLinearAds>
        </Creative>
      </Creatives>

  return {xml,file:asset,asset};

function encodeGuide(f){
  const p=props(f),a=state.asset;if(!a||a.type!=='video')return '# Upload a video file first.\n';
  const I=a.insp||{},v=I.video||{},L=LOUD[state.loud],R=renditions(f,a),src=a.name.replace(/"/g,'\\"');
  const fps=v.fps||25,outFps=fps>30.01?fps/2:fps,rate=Math.abs(outFps-29.97)<.02?'30000/1001':Math.abs(outFps-23.976)<.02?'24000/1001':fmtFps(outFps);
  const noAudio=I.mp4&&!I.audio,ain=noAudio?' -f lavfi -i anullsrc=r=48000:cl=stereo':'',amap=noAudio?' -map 0:v:0 -map 1:a:0 -shortest':' -map 0:v:0 -map 0:a:0?';
  const loud=`loudnorm=I=${L.target}:TP=${LOUD.peak}:LRA=11`;
  const fit=(w,h)=>`scale=${w}:${h}:force_original_aspect_ratio=decrease,pad=${w}:${h}:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1`;
  const lines=[
    `# Ad Format Studio · encoding commands`,
    `# ${p.brand} · ${f.name} (${CHANNELS[f.ch].label})`,
    `# Source: ${a.name}${v.w?` · ${v.w}×${v.h}`:''}${v.fps?` · ${fmtFps(v.fps)} fps`:''}${a.dur?` · ${a.dur.toFixed(2)}s`:''}`,
    `# These make the exact files named in this format's VAST tag. Upload them to ${vastBase()}`,
    `# Targets (IAB DV & CTV 2022): H.264 + AAC-LC 192 kbps, 48 kHz stereo, ${L.target} ${L.unit} ±${L.tol} (${L.label}), peaks at or below ${LOUD.peak} dB, MOOV atom first.`,
    `# Needs ffmpeg 5 or later. Run each command from the folder that holds the source file.`,
    ``,
    `# 1. Ready-to-serve renditions`];
  for(const r of R)lines.push(`ffmpeg -y -i "${src}"${ain}${amap} -c:v libx264 -profile:v ${r.prof} -level:v ${r.lvl} -pix_fmt yuv420p -vf "${fit(r.w,r.h)}" -r ${rate} -b:v ${r.kbps}k -maxrate ${Math.round(r.kbps*1.1)}k -bufsize ${r.kbps*2}k -g ${Math.round(outFps*2)} -c:a aac -profile:a aac_low -b:a 192k -ar 48000 -ac 2 -af "${loud}" -movflags +faststart "${r.file}"`);
  lines.push(``,`# 2. Mezzanine for server-side transcoding (ProRes 422 HQ, 24-bit PCM)`,
    `ffmpeg -y -i "${src}"${ain}${amap} -c:v prores_ks -profile:v 3 -pix_fmt yuv422p10le -vf "${fit(f.w,f.h)}" -r ${rate} -c:a pcm_s24le -ar 48000 -ac 2 -af "${loud}" "${mezzFile(f)}"`);
  if(f.ch!=='ctv'&&f.comps)lines.push(``,`# 3. Companions: export ${f.comps.map(c=>`companion_${c[0]}x${c[1]}.jpg`).join(' and ')} from Ad Format Studio (Export > VAST in a .zip includes them).`);
  if(I.frames&&I.frames.bars)lines.push(``,`# Note: the source has a burned-in ${I.frames.bars}. Find the crop with:`,`#   ffmpeg -i "${src}" -vf cropdetect -f null -`,`# then add crop=W:H:X:Y before scale in the -vf filters above.`);
  if(I.frames&&I.frames.lead)lines.push(``,`# Note: the source opens on a ${I.frames.lead}. Trim it by adding -ss 0.5 (or the slate length) before -i.`);
  lines.push(``,`# Check a result:`,`ffprobe -v error -show_entries stream=codec_name,profile,level,width,height,r_frame_rate,bit_rate,sample_rate,channels -of compact "${R[0].file}"`,`ffmpeg -hide_banner -i "${R[0].file}" -af ebur128=peak=true -f null -`,``);
  return lines.join('\n');
}
